<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>事故现场点云勘查系统</title>
    <style>
      :root {
        --bg: #14171c; --panel: #1d2129; --panel2: #232834; --line: #323a48;
        --fg: #d7dde6; --dim: #8b94a3; --accent: #4da3ff; --danger: #ff5d5d;
        --ok: #4fce7a; --warn: #ffb84d;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
        font: 13px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; }
      #app { display: flex; height: 100vh; }
      nav { width: 168px; flex: none; background: var(--panel); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; padding: 10px 8px; gap: 2px; }
      nav .brand { font-weight: 600; font-size: 14px; padding: 8px 10px 14px; color: var(--accent); }
      nav a { color: var(--dim); text-decoration: none; padding: 8px 10px; border-radius: 6px; }
      nav a:hover { background: var(--panel2); color: var(--fg); }
      nav a.active { background: var(--panel2); color: var(--accent); }
      main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
      .page { flex: 1; min-height: 0; overflow: auto; padding: 16px; display: none; }
      .page.active { display: block; }
      .page.fill { padding: 0; overflow: hidden; display: none; }
      .page.fill.active { display: flex; flex-direction: column; }
      h2 { margin: 0 0 12px; font-size: 16px; }
      h3 { margin: 16px 0 8px; font-size: 13px; color: var(--dim); text-transform: none; }
      table { border-collapse: collapse; width: 100%; }
      th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
      th { color: var(--dim); font-weight: 500; }
      tr.over-limit td { color: var(--danger); }
      button, .btn { background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
        border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit; }
      button:hover { border-color: var(--accent); }
      button.primary { background: var(--accent); border-color: var(--accent); color: #0b1521; font-weight: 600; }
      button.danger { color: var(--danger); }
      button:disabled { opacity: .45; cursor: default; }
      input, select { background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
        border-radius: 6px; padding: 4px 8px; font: inherit; }
      input[type=number] { width: 90px; }
      label.field { display: inline-flex; align-items: center; gap: 6px; margin: 4px 10px 4px 0; color: var(--dim); }
      .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px;
        background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
      .viewport-wrap { position: relative; flex: 1; min-height: 0; }
      canvas.gpu { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .hud { position: absolute; left: 10px; bottom: 10px; background: rgba(20,23,28,.8);
        padding: 6px 10px; border-radius: 6px; font-size: 12px; color: var(--dim); pointer-events: none; white-space: pre; }
      .panel-side { width: 300px; flex: none; background: var(--panel); border-left: 1px solid var(--line);
        overflow: auto; padding: 12px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin-bottom: 12px; }
      .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; background: var(--panel2); }
      .tag.ok { color: var(--ok); } .tag.bad { color: var(--danger); } .tag.warn { color: var(--warn); }
      .err { color: var(--danger); white-space: pre-wrap; }
      .muted { color: var(--dim); }
      .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 28px; text-align: center; color: var(--dim); }
      .drop.over { border-color: var(--accent); color: var(--accent); }
      progress { width: 220px; }
      .list-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
      .list-item:hover { background: var(--panel2); }
      .list-item.sel { background: var(--panel2); outline: 1px solid var(--accent); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
